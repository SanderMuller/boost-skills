name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      # Opens or updates the release PR from the Conventional Commits on the release branch, and
      # tags the release when that PR merges. Settings: release-please-config.json.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
