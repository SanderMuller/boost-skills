name: conventional-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: conventional-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      # A squash merge uses the PR title as the commit header. A release tool skips a header it
      # cannot parse without a warning, so a bad title drops the change from the release.
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'

          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
            exit 0
          fi

          echo "::error title=PR title is not a Conventional Commit::'$TITLE' must look like 'feat: …', 'fix(parser): …' or 'feat!: …'. Allowed types: feat, fix, perf, refactor, docs, style, test, build, ci, chore, revert."
          exit 1
