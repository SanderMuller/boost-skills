name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BOOST_SKIP_AUTOSYNC: 1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: composer install --no-interaction --no-progress --no-scripts --no-plugins

      - run: php .github/validate-skills.php

      - run: php .github/validate-catalog.php

      - run: node .github/test-dangling-symbols.mjs

      - run: composer validate-gitattributes
